
name: Generate Snake

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: notamecarmel
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish snake to output branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          REPO="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads "$REPO" output >/dev/null 2>&1; then
            echo "Output branch exists. Cloning..."
            git clone --depth 1 --branch output "$REPO" output-repo
          else
            echo "Output branch does not exist. Creating..."
            mkdir output-repo
            cd output-repo
            git init
            git checkout --orphan output
            git remote add origin "$REPO"
            cd ..
          fi

          # Remove old published files, preserving .git
          find output-repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          # Copy the newly generated SVG files
          cp -R dist/. output-repo/

          cd output-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Update contribution snake" || echo "No changes to commit"
          git push origin HEAD:output